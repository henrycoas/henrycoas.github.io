<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enric Condal Asensio</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <link href="https://fonts.googleapis.com/css?family=Raleway&display=swap" rel="stylesheet" />
  </head>
  <body class="mode-explore">
    <header class="site-nav" role="banner">
      <h1 class="site-nav__title">Enric Condal Asensio</h1>
      <nav class="site-nav__controls" aria-label="Main navigation">
        <button type="button" id="mode-toggle" class="nav-btn nav-btn--primary" aria-pressed="false">
          Overview
        </button>
        <div class="site-nav__categories" role="group" aria-label="Categories"></div>
      </nav>
    </header>

    <section id="cockpit" class="cockpit" aria-label="Command deck">
      <div class="cockpit__hull">
        <div class="cockpit__side cockpit__side--left" aria-hidden="true"></div>
        <div class="cockpit__deck">
          <div class="cockpit__window-wrap">
            <div id="canvas-container" class="cockpit__window" aria-hidden="true"></div>
            <div class="cockpit__viewport-msg" aria-label="Message from Enric">
              <p class="cockpit__viewport-msg-line">&gt; [NEW MESSAGE] ORIGIN NODE: ENRIC CONDAL ASENSIO</p>
              <p class="cockpit__viewport-msg-line cockpit__viewport-msg-line--sub">And... done. Now you should be able to access my portfolio.</p>
            </div>
            <div class="cockpit__window-frame" aria-hidden="true"></div>
            <div class="cockpit__window-bar">
              <span class="cockpit__console-label">MAIN DISPLAY</span>
              <span id="cockpit-status" class="cockpit__status">SYS ONLINE</span>
            </div>
          </div>
          <div id="main-screen" class="cockpit__screen" role="region" aria-label="Portfolio display"></div>
        </div>
        <div class="cockpit__side cockpit__side--right" aria-hidden="true"></div>
      </div>
    </section>

    <main id="overview" class="overview" hidden>
      <div id="overview-sections"></div>
    </main>

    <p id="fallback-notice" class="fallback-notice" hidden>
      3D view unavailable — showing overview.
    </p>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
